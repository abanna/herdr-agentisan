name: Bug report
description: Something behaves differently from what the docs or tests promise.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `task check`. If it fails, paste the failing gate
        below — that output is usually the whole report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behaviour, and what you expected instead.
      placeholder: |
        Expected: `herdr plugin action invoke nerdsrun.agentisan.ping` shows a toast.
        Actual:   it exits 0 and nothing appears.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest command sequence that shows it.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - Plugin binary (cmd/herdr-agentisan)
        - Domain (internal/)
        - devctl / repository tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: gate-output
    attributes:
      label: Relevant gate output
      description: Output of the failing `task check` step, if any.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `herdr-agentisan version` or the commit SHA.
