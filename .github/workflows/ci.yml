name: CI

# THROWAWAY (NERD-5676, gates/covdata): can Go's own binary coverage data
# and `go tool covdata textfmt` replace devctl coverage-merge? Never merged.
# All three runs skip the two tests that check this repo's ci.yml against
# AGENTS.md, which this throwaway ci.yml cannot match.

on:
  push:
    branches: [main, 'gates/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.11"

jobs:
  shard:
    name: covdata (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [dashboard, store, daemon, workforce, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: mkdir -p covdata && go test -race -timeout 5m -skip '^(TestParityHoldsInThisRepo|TestDocsParityCommandPasses)$' -cover -covermode=atomic -coverpkg=./internal/... $(go run ./cmd/devctl test-packages ${{ matrix.shard }}) -args -test.gocoverdir=$PWD/covdata
      - run: ls covdata | sed -E 's/\.[0-9a-f]{32}.*//' | sort | uniq -c; du -sh covdata
      - uses: actions/upload-artifact@v7
        with:
          name: covdata-${{ matrix.shard }}
          path: covdata/
          if-no-files-found: error

  single-text:
    name: single (today's text profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -skip '^(TestParityHoldsInThisRepo|TestDocsParityCommandPasses)$' -coverpkg=./internal/... -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v7
        with:
          name: single-text
          path: coverage.out
          if-no-files-found: error

  single-covdata:
    name: single (binary covdata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: mkdir -p covdata && go test -race -timeout 5m -skip '^(TestParityHoldsInThisRepo|TestDocsParityCommandPasses)$' -cover -covermode=atomic -coverpkg=./internal/... ./... -args -test.gocoverdir=$PWD/covdata
      - run: go tool covdata textfmt -i=covdata -o single-covdata.out
      - uses: actions/upload-artifact@v7
        with:
          name: single-covdata
          path: single-covdata.out
          if-no-files-found: error

  compare:
    name: compare
    needs: [shard, single-text, single-covdata]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: covdata-*
          path: shards
      - uses: actions/download-artifact@v8
        with:
          name: single-text
          path: single-text
      - uses: actions/download-artifact@v8
        with:
          name: single-covdata
          path: single-covdata
      - run: ls -R shards | head -40
      - run: go tool covdata textfmt -i=$(ls -d shards/covdata-* | paste -sd, -) -o coverage.out
      - run: go run ./cmd/devctl coverage --profile coverage.out --min 75
      - run: go run ./cmd/devctl coverage --profile single-text/coverage.out --min 75
      - run: go run ./cmd/devctl coverage --profile single-covdata/single-covdata.out --min 75
      - run: go tool covdata percent -i=$(ls -d shards/covdata-* | paste -sd, -) | tail -40
      - name: compare the statement sets
        run: |
          python3 - coverage.out single-text/coverage.out single-covdata/single-covdata.out <<'EOF'
          import sys
          def load(p):
              blocks, modes = {}, set()
              for line in open(p):
                  line = line.rstrip("\n")
                  if line.startswith("mode:"):
                      modes.add(line); continue
                  if not line:
                      continue
                  pos, n, c = line.rsplit(" ", 2)
                  key = (pos, int(n))
                  blocks[key] = blocks.get(key, 0) + int(c)
              return blocks, modes
          names = ["shards via covdata textfmt", "single text profile (today)", "single via covdata textfmt"]
          sets = []
          for name, p in zip(names, sys.argv[1:]):
              b, m = load(p)
              stm = sum(n for (_, n) in b)
              cov = sum(n for (k, n) in b if b[(k, n)] > 0)
              pkgs = {k.rsplit("/", 1)[0] for (k, _) in b}
              print(f"{name}: modes {sorted(m)}, {len(b)} distinct blocks, {stm} statements, {cov} covered, {100*cov/stm:.2f}%, {len(pkgs)} directories")
              sets.append(b)
          for i, j in [(0, 1), (0, 2), (1, 2)]:
              a, b = set(sets[i]), set(sets[j])
              print(f"{names[i]} vs {names[j]}: only first {len(a-b)}, only second {len(b-a)}")
              for k in sorted(a - b)[:5]: print("   only first:", k)
              for k in sorted(b - a)[:5]: print("   only second:", k)
          EOF
