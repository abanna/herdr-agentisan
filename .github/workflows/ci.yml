name: CI

on:
  push:
    branches: [main, 'gates/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.11"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go tool golangci-lint run --allow-serial-runners ./...
      - run: go tool golangci-lint fmt --diff ./...
      - run: go vet ./...

  # The unit suite runs as five jobs, each on a runner of its own (NERD-5676);
  # `devctl test-packages` names each job's packages, so a new package needs
  # no edit here. `test` merges their coverage profiles and enforces the floor.
  test-dashboard:
    name: test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -coverpkg=./internal/... -coverprofile=coverage-dashboard.out -covermode=atomic $(go run ./cmd/devctl test-packages dashboard)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-dashboard
          path: coverage-dashboard.out
          if-no-files-found: error

  test-store:
    name: test (store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -coverpkg=./internal/... -coverprofile=coverage-store.out -covermode=atomic $(go run ./cmd/devctl test-packages store)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-store
          path: coverage-store.out
          if-no-files-found: error

  test-daemon:
    name: test (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -coverpkg=./internal/... -coverprofile=coverage-daemon.out -covermode=atomic $(go run ./cmd/devctl test-packages daemon)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-daemon
          path: coverage-daemon.out
          if-no-files-found: error

  test-workforce:
    name: test (workforce)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -coverpkg=./internal/... -coverprofile=coverage-workforce.out -covermode=atomic $(go run ./cmd/devctl test-packages workforce)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-workforce
          path: coverage-workforce.out
          if-no-files-found: error

  test-rest:
    name: test (rest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -timeout 5m -coverpkg=./internal/... -coverprofile=coverage-rest.out -covermode=atomic $(go run ./cmd/devctl test-packages rest)
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rest
          path: coverage-rest.out
          if-no-files-found: error

  test:
    name: test
    # Runs unless cancelled, so a failed test job fails this check, not skips it.
    needs: [test-dashboard, test-store, test-daemon, test-workforce, test-rest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: fail unless every test job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: go run ./cmd/devctl coverage-merge --out coverage.out
      - run: go run ./cmd/devctl coverage --profile coverage.out --min 75

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # gitleaks git mode walks commit history; a shallow clone would hide it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go tool gosec -quiet ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --config .gitleaks.toml --no-banner --redact
      - run: go tool govulncheck ./...

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run ./cmd/devctl docs-parity
      - run: go run ./cmd/devctl large-files

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: astral-sh/setup-uv@v7
      # The local hooks invoke task targets so Taskfile stays the single
      # source of gate truth; that makes `task` a dependency of this job.
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uvx pre-commit run --all-files
        # gitleaks-staged reads the git index, which is empty in CI: it would
        # report Passed having scanned nothing. The security job scans full
        # history instead. Skipping by id keeps the hook useful locally, and
        # setting it in env rather than inline keeps the `run:` line identical
        # to the one AGENTS.md and the Taskfile document.
        env:
          SKIP: gitleaks-staged

  modernize:
    name: modernize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go tool modernize ./...
