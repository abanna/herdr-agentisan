# herdr plugin manifest. See https://herdr.dev/docs/plugins/.
#
# Every command is ONE exec of an argv array with the plugin root as the
# working directory — no shell. herdr runs them, never the plugin. `herdr plugin link` does not run [[build]]
# (only `herdr plugin install` does), so link with `task plugin:link`, which
# builds first. internal/cli's TestManifestMatchesTheBinary fails the build if
# an action stops naming a real command or the build output path drifts.
id = "nerdsrun.agentisan"
name = "Agentisan"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Agentisan agent orchestration for herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-agentisan", "./cmd/herdr-agentisan"]

# One daemon per herdr server (ADR-001 D3). herdr runs this on every server
# start and live handoff, never on link: after `task plugin:link`, run the
# daemon-restart action.
[[startup]]
command = ["bin/herdr-agentisan", "daemon", "start"]

[[actions]]
id = "ping"
title = "Agentisan: ping"
description = "Show a toast proving the plugin is wired up"
contexts = ["global"]
command = ["bin/herdr-agentisan", "action", "ping"]

[[actions]]
id = "daemon-restart"
title = "Agentisan: restart daemon"
description = "Stop the agentisan daemon if it runs, then start it"
contexts = ["global"]
command = ["bin/herdr-agentisan", "daemon", "restart"]

# The dashboard's [ btop ] button asks herdr (plugin.pane.open) to run this in
# a popup, sized in the request. herdr spawns btop from its own PATH; the
# plugin starts no process. Relink after changing it: herdr reads panes at
# link time.
[[panes]]
id = "btop"
title = "btop"
description = "System monitor, in a popup"
placement = "popup"
command = ["btop"]
