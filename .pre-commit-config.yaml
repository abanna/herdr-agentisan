# Pre-commit hooks for go-agents.
#
# The Go hooks invoke TASK TARGETS, not copies of the underlying commands.
# An earlier revision hand-copied five gate command lines here, which made this
# file a fourth source of gate truth that `devctl docs-parity` cannot see — it
# reads only AGENTS.md, Taskfile.yml and ci.yml. Changing a copy here (a
# narrower golangci-lint scope, a dropped --config, a bumped gitleaks pin)
# would have left every check green while the local gate and the real gate
# quietly disagreed. Referencing the target instead makes drift impossible:
# there is nothing here to drift from.
#
# Install once:  task hooks:install
# Run manually:  task hooks

repos:
  # Generic hygiene — cheap, language-agnostic, catches the mechanical stuff.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # readiness-*.{json,html} are regenerated by the readiness skill and
      # would flip-flop on every audit if the fixer normalised them.
      - id: trailing-whitespace
        exclude: '(\.(golden|snap)$|^readiness-)'
      - id: end-of-file-fixer
        exclude: '(\.(golden|snap)$|^readiness-)'
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # Belt to `task large-files`' braces: this catches the file BEFORE it
        # is committed; the gate catches it after. Both compare raw bytes
        # against 512*1024, so neither is looser than the other.
        #
        # --enforce-all is required, not optional. Without it the hook
        # intersects its file list with `git diff --cached --name-only`, so
        # under `pre-commit run --all-files` — the CI hooks job and
        # `task hooks` — nothing is staged, it inspects ZERO files and always
        # passes. Verified: a 684KB unstaged file reports "Passed". That is
        # the same vacuous green this PR removed from the gitleaks hook.
        args: [--maxkb=512, --enforce-all]
        # go.sum is allowlisted by `devctl large-files` because it is a
        # generated manifest that grows with the tool directive. Excluding it
        # here too keeps the two ceilings aligned: without this, a dependency
        # bump past 512KB would leave CI green while every local commit
        # failed, and the only fix would be editing a file AGENTS.md marks
        # Do-not-touch.
        exclude: '^go\.sum$'
      # No exclude needed: scrub_test.go assembles its PEM-header fixture
      # at runtime, so the literal this hook looks for is not in the file.
      - id: detect-private-key

  - repo: local
    hooks:
      - id: fmt
        name: format check
        entry: task fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: lint
        name: lint
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false

      - id: vet
        name: vet
        entry: task vet
        language: system
        types: [go]
        pass_filenames: false

      - id: large-files
        name: tracked file size ceiling
        entry: task large-files
        language: system
        pass_filenames: false

      # Secrets in the STAGED diff — the half that stops a secret from ever
      # landing. Verified to do real work at commit time: staging a
      # stripe-shaped key makes this scan 58 bytes and exit 1.
      #
      # It is meaningless under `pre-commit run --all-files`, where nothing is
      # staged: it scans zero bytes and reports Passed. That vacuous green was
      # the review finding — so the CI hooks job SKIPs it by id rather than
      # this hook being deleted, which would have cost the local coverage that
      # actually works. `task secrets` (full history) owns CI.
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: task secrets:staged
        language: system
        pass_filenames: false

      # The three sources of gate truth must not drift within one commit.
      - id: docs-parity
        name: docs parity (AGENTS.md / Taskfile.yml / ci.yml)
        entry: task docs
        language: system
        pass_filenames: false

# Secrets are deliberately NOT scanned here.
#
# The obvious hook, `gitleaks protect --staged`, reads the git index — and in
# CI (`pre-commit run --all-files`) nothing is ever staged, so it reported
# "Passed" having examined zero bytes. A check that cannot fail is not a gate,
# it is a green tick, and this one sat in the very job whose purpose is
# proving the hooks work.
#
# `task secrets` (gitleaks over full history) owns secret scanning and runs in
# both `task check` and the CI `security` job, where it scans real content and
# can actually fail. `detect-private-key` above still inspects real files at
# commit time, so the local path is not left empty.
