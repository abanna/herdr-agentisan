apiVersion: v1
kind: Service
metadata:
  name: go-agents
  labels:
    app.kubernetes.io/name: go-agents
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-agents
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # The admin port (9090, /metrics + /debug/pprof) is deliberately ABSENT.
  #
  # This is the enforcement half of the split documented in
  # docs/architecture.md: a second listener only protects anything if nothing
  # routes to it. Prometheus reaches it by scraping the pod IP directly, which
  # needs no Service; a client inside the cluster cannot reach it through this
  # one. `devctl manifests` fails the build if the admin port is ever added
  # here, because adding it would publish heap dumps and goroutine stacks to
  # anything that can resolve the Service name.
