apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-agents
  labels:
    app.kubernetes.io/name: go-agents
    app.kubernetes.io/component: api
spec:
  replicas: 2
  # Progressive rollout, made real rather than asserted: maxUnavailable 0 means
  # a new pod must pass its readinessProbe before an old one is removed, so a
  # broken image stalls the rollout instead of taking the service down. That is
  # also what makes `kubectl rollout undo` a meaningful recovery step —
  # see docs/runbooks/rollback.md.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Long enough to cover GO_AGENTS_SHUTDOWN_TIMEOUT (10s) plus the time the
  # endpoints controller needs to stop routing to a terminating pod. Shorter
  # than the drain window would SIGKILL requests the process was draining.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: go-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-agents
        app.kubernetes.io/component: api
      annotations:
        # Prometheus scrapes the ADMIN port directly off the pod. The Service
        # deliberately does not expose it — see service.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # 65532 is what `USER nonroot` resolves to in the distroless base. The
        # numbers are spelled here rather than inherited so the kubelet can
        # enforce runAsNonRoot without resolving a name it cannot see inside
        # the image. `devctl manifests` fails if these two ever disagree.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes so losing one node cannot take both replicas, and
      # so the PodDisruptionBudget below is more than paperwork.
      #
      # DoNotSchedule, not ScheduleAnyway. ScheduleAnyway is only a scheduler
      # SCORE: it is routinely outweighed and both replicas land together —
      # measured here, not assumed. A spread that holds only when nothing else
      # is happening is not an availability property.
      #
      # The usual objection to DoNotSchedule is that it blocks recovery: lose a
      # node and the replacement pod cannot schedule without violating maxSkew.
      # The two Honor policies are what remove that. A down node carries a
      # NotReady taint this pod does not tolerate, so with nodeTaintsPolicy
      # Honor it stops counting as a topology domain and the surviving node
      # becomes the only one — skew 0, replacement schedules. Same mechanism
      # makes a single-node cluster schedulable: one domain cannot be skewed.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          # Scope the skew calculation to pods of the SAME ReplicaSet.
          #
          # Without this, DoNotSchedule still lets a rolling update finish
          # skewed, because the constraint is evaluated at scheduling time
          # against whatever pods exist THEN — including the outgoing ones.
          # Walk it: old-A on node1, old-B on node2; the first new pod lands on
          # node1 (2 vs 1, skew 1, allowed); old-A goes; the second new pod
          # also fits node1 (2 vs 1 again, allowed); old-B goes; both replicas
          # are now on node1 and nothing re-evaluates. Observed here, twice.
          #
          # pod-template-hash makes each new pod see only its own generation:
          # the first can go anywhere, the second must take the other node.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-agents
      containers:
        - name: server
          image: go-agents:dev
          # Never: the tag is mutable and `kind load docker-image` puts the
          # image on the node, so pulling would fail against a registry that
          # has never heard of it.
          imagePullPolicy: Never
          args: []
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9090
              protocol: TCP
          env:
            - name: GO_AGENTS_ENV
              value: staging
            - name: GO_AGENTS_LOG_FORMAT
              value: json
            - name: GO_AGENTS_LOG_LEVEL
              value: info
            - name: GO_AGENTS_HTTP_ADDR
              value: :8080
            - name: GO_AGENTS_ADMIN_ADDR
              value: :9090
            - name: GO_AGENTS_SERVICE_NAME
              value: go-agents
            - name: GO_AGENTS_OTLP_ENDPOINT
              value: otel-collector.observability.svc.cluster.local:4318
            - name: GO_AGENTS_TRACE_SAMPLE_RATIO
              value: "1.0"
            # GO_AGENTS_ENV is staging, so config.Load() refuses to start
            # without this. The Secret is created by `task kind:up` from
            # locally generated randomness and is never committed — see
            # AGENTS.md rule 1.
            - name: GO_AGENTS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: go-agents-api-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory is limited because exceeding it is a bug worth an OOM.
              # CPU deliberately is NOT: a CPU limit throttles latency-
              # sensitive request handling for no isolation benefit the
              # request already provides.
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Three probes, three different jobs. Collapsing them is the usual
          # mistake: a liveness probe that touches the store restarts the pod
          # when a dependency is slow, turning a degradation into an outage.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            # /healthz answers from the process alone. Restart only when the
            # process itself is wedged.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # /readyz touches the store, so a broken dependency removes this
            # pod from the Service rather than restarting it.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
