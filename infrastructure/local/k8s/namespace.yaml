apiVersion: v1
kind: Namespace
metadata:
  name: go-agents
  labels:
    app.kubernetes.io/name: go-agents
    app.kubernetes.io/part-of: go-agents
    # Enforce the restricted Pod Security Standard at admission. The pod spec
    # already satisfies it; this makes a future relaxation fail to apply
    # instead of quietly succeeding.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
