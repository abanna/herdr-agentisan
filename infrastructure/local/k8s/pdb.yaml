apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-agents
  labels:
    app.kubernetes.io/name: go-agents
spec:
  # With replicas: 2 this keeps one pod serving through a voluntary
  # disruption — a node drain, a cluster upgrade. minAvailable: 1 rather than
  # maxUnavailable: 0, which would block drains forever instead of ordering
  # them.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-agents
