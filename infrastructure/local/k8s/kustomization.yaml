apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-agents

# Kept deliberately thin. `devctl manifests` reads the raw files below rather
# than a kustomize render, so every transformation added here is an invariant
# the gate stops seeing. Namespace and common labels are safe: neither can
# turn a correct probe, port or securityContext into a wrong one.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: go-agents
      app.kubernetes.io/managed-by: kustomize
