apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-pipeline
data:
  # Mounted at the image's default --config path (/etc/otelcol-contrib/
  # config.yaml), so the container keeps its baked-in CMD and there is no
  # second place where the path could drift.
  #
  # The collector does not watch this file. Editing it and re-applying updates
  # the ConfigMap and nothing else; the running process keeps the config it
  # started with until `kubectl --context kind-go-agents -n observability
  # rollout restart deploy/otel-collector`.
  config.yaml: |
    extensions:
      # Without this there is nothing to probe: the collector image has no
      # shell, so an exec probe is impossible, and the 8888 telemetry port
      # answers before the pipeline is actually up.
      health_check:
        # Explicit 0.0.0.0 for the same reason as the receivers below.
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          # Both endpoints are spelled out because recent collector releases
          # default the bind host to localhost (the
          # component.UseLocalHostAsDefaultHost gate). An omitted `endpoint`
          # binds 127.0.0.1 inside the pod's netns, which accepts nothing from
          # another pod and fails silently — the app would export spans into a
          # refused connection with no error on this side.
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # memory_limiter must be FIRST in the pipeline. Anywhere else and the
      # processors ahead of it have already allocated the memory it exists to
      # refuse. limit_mib sits below the 256Mi container limit so the collector
      # sheds load with a retryable error before the kernel OOM-kills it and
      # takes the in-flight batch with it.
      memory_limiter:
        check_interval: 1s
        limit_mib: 180
        spike_limit_mib: 40
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      # OTLP, not a Tempo-specific exporter, because there is no such thing:
      # Tempo's ingest IS OTLP, so swapping the previous tracing backend out
      # was a change of endpoint and nothing else. The pipeline below never
      # learned which store it writes to, which is why the swap is three lines.
      otlp/tempo:
        # gRPC on 4317. Tempo's distributor is configured with only the gRPC
        # OTLP receiver (see tempo.yaml), so this port is not interchangeable
        # with 4318.
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          # Plaintext inside the cluster. There is no CA to trust here and
          # inventing one would be ceremony, not security, on a local kind
          # cluster whose traffic never leaves the host.
          insecure: true
      # Stays, and stays at `basic` rather than `detailed`: it is what makes
      # `kubectl --context kind-go-agents -n observability logs
      # deploy/otel-collector` answer "are spans arriving at all?" without
      # standing up a second consumer. That question got HARDER with Tempo,
      # not easier — Tempo has no UI of its own, so a trace that never left
      # the collector and a trace Grafana cannot query look identical from the
      # outside, and this exporter is what separates them. `detailed` prints
      # every attribute of every span and would bury the answer.
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          # The `readers` form, not the older `service.telemetry.metrics.address`
          # key, which is deprecated. host must be 0.0.0.0 here too: the same
          # localhost default applies, and Prometheus scrapes this port across
          # the pod boundary.
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        # Traces only. Metrics reach Prometheus by direct scrape of each pod's
        # own endpoint; routing them through here as well would add a hop that
        # can drop data and would hide the `up` series that says whether a
        # target is alive.
        #
        # Logs are the same answer with a different mechanism: nothing here
        # emits OTLP logs — internal/telemetry wires otlptracehttp only — and
        # the application's stdout is already collected by the Alloy DaemonSet,
        # which reads it from the Kubernetes API and pushes to Loki. Loki's
        # native /otlp/v1/logs endpoint is enabled and waiting (see loki.yaml)
        # for the day the service exports logs over OTLP; until then a logs
        # pipeline here would be a hop with nothing in it.
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-pipeline
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two collectors briefly sharing the Service
  # would split a trace's spans across processes for no benefit, and there is
  # nothing to keep available — the app buffers and retries its exports.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: telemetry-pipeline
      annotations:
        # 8888 is deliberately absent from the Service below. Prometheus reaches
        # it by scraping the pod IP, which needs no Service — the same split the
        # app uses for its admin port.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Verified against the image: USER is 10001:10001.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.140.1
          # contrib, not the core distribution: core omits exporters a local
          # stack usually reaches for next (loki, clickhouse, file). Pinned to
          # a patch release; :latest here would change the pipeline schema
          # under a cluster nobody rebuilt.
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Unlike the API (see infrastructure/local/k8s/deployment.yaml, which omits its
              # CPU limit on purpose), the observability stack gets one: it is
              # background infrastructure on a laptop with no per-request
              # latency budget, and bounding it is what keeps a span flood from
              # starving the workload it is supposed to be observing.
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-pipeline
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    # 4318 is the one the app actually uses (GO_AGENTS_OTLP_ENDPOINT points
    # here). 4317 is published so a sidecar or a local `otel-cli` can use gRPC
    # without a second Service.
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
  # 8888 and 13133 are intentionally not published: internal telemetry and a
  # health endpoint are for the kubelet and for Prometheus's pod scrape, not
  # for anything that can resolve this name.
