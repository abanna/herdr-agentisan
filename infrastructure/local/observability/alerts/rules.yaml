# Prometheus alert rules for the go-agents API.
#
# NOTHING ROUTES THESE ANYWHERE: the cluster runs no Alertmanager and this
# stack declares no `alerting:` block, so a firing alert surfaces only in the
# Prometheus UI. Read every "pages" below as "would page once a receiver is
# wired"; the severity labels are the routing decision, made in advance.
#
# CONTRACT WITH THE SCRAPE CONFIG: every expression below selects
# job="go-agents". Annotation-based pod discovery labels targets with the
# scrape_config's own job_name (conventionally "kubernetes-pods"), so the
# scrape config MUST relabel it, mapping
# __meta_kubernetes_pod_label_app_kubernetes_io_name onto job. If that relabel
# is dropped, six of the seven rules here match nothing and fall silent — the
# failure mode is silence, not an error. GoAgentsNoTargets is the seventh
# and the reason it exists: absent() fires precisely when the selector matches
# nothing, so a broken relabel announces itself instead of hiding.
#
# This is a plain rule file, not a PrometheusRule CRD: the cluster runs no
# operator, so it is mounted by a kustomize configMapGenerator and named from
# rule_files in prometheus.yml. rules_test.yaml beside it is the promtool unit
# test; CI gates on both `promtool check rules` and `promtool test rules`.
groups:
  - name: go-agents
    # Pinned rather than inherited from the global default so that retuning
    # scrape cadence cannot quietly stretch or shrink every `for:` below.
    interval: 30s
    rules:
      # ---------------------------------------------------------------------
      # Availability
      # ---------------------------------------------------------------------

      # up == 0 cannot fire when the series does not exist at all. A deleted
      # Deployment, a namespace wiped, or a relabel rule that stopped matching
      # all produce zero targets and therefore zero `up` samples, which reads
      # as "nothing wrong" on every other rule in this file. absent() is the
      # only expression that notices.
      - alert: GoAgentsNoTargets
        expr: absent(up{job="go-agents"})
        # Long enough to ride out a Prometheus restart or a service-discovery
        # refresh, short enough that a wiped Deployment pages within a coffee.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus has no go-agents targets'
          description: 'Service discovery has returned zero targets for job {{ $labels.job }} for 5 minutes. Either every pod is gone or the scrape config no longer selects them. Note that GoAgentsAbsent cannot fire in this state, because there is no up series to be zero.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/on-call-triage.md'

      - alert: GoAgentsAbsent
        expr: up{job="go-agents"} == 0
        # Four consecutive rule evaluations at the 30s group interval, which
        # is roughly eight 15s scrapes rather than four — evaluation cadence
        # and scrape cadence are separate knobs. A pod being replaced during a
        # rolling update disappears from discovery rather than scraping as 0,
        # so this does not need to tolerate a rollout; it needs to tolerate a
        # flaky scrape.
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'go-agents instance {{ $labels.instance }} is not scrapeable'
          description: 'Prometheus has failed to scrape {{ $labels.instance }} (job {{ $labels.job }}) for 2 minutes. The admin listener on :9090 is serving neither /metrics nor anything else, which points at a dead or wedged process rather than an unhealthy dependency.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/incident-response.md'

      # ---------------------------------------------------------------------
      # Errors
      # ---------------------------------------------------------------------

      # Probe routes are excluded deliberately. The kubelet hits /readyz every
      # 5s and /healthz every 10s per pod, so on an idle service probe traffic
      # is nearly all the traffic: including it would both satisfy the
      # minimum-traffic guard on its own and dilute a real user-facing error
      # ratio into invisibility. A failing /readyz is a different incident with
      # a different remedy, and GoAgentsReadinessFailing owns it.
      #
      # The trailing `and` is the low-traffic guard. One 500 out of two
      # requests is a 50% error rate and is not an incident; 0.5 req/s is 150
      # requests across the 5m window, enough that the ratio means something.
      # It also removes the 0/0 case, which would otherwise evaluate to NaN.
      - alert: GoAgentsHighErrorRate
        expr: |
          sum by (job) (
            rate(http_requests_total{job="go-agents",route!~"/healthz|/readyz",status=~"5.."}[5m])
          )
          /
          sum by (job) (
            rate(http_requests_total{job="go-agents",route!~"/healthz|/readyz"}[5m])
          )
          > 0.05
          and
          sum by (job) (
            rate(http_requests_total{job="go-agents",route!~"/healthz|/readyz"}[5m])
          )
          > 0.5
        # The rate window already smooths 5 minutes; a further 5m of `for`
        # means a genuine error budget burn, not a deploy blip.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'go-agents is serving 5xx to more than 5% of requests'
          description: 'The 5xx ratio for job {{ $labels.job }} is {{ $value | printf "%.3f" }} over the last 5m, against a threshold of 0.050, on more than 0.5 req/s of non-probe traffic.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/incident-response.md'

      # ---------------------------------------------------------------------
      # Latency
      # ---------------------------------------------------------------------

      # Grouped by route so the page names the slow endpoint: an aggregate p99
      # across /version and /v1/notes tells you a number and nothing else.
      # 0.5s is deliberately inside the bucket range (the histogram tops out at
      # 4s) so the quantile is interpolated rather than clamped to the last
      # finite boundary.
      #
      # The guard reuses the +Inf bucket as the request-rate denominator rather
      # than pulling in _count: they are the same number, and one fewer series
      # in the expression is one fewer thing to keep in sync.
      - alert: GoAgentsHighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, route, le) (
              rate(http_request_duration_seconds_bucket{job="go-agents",route!~"/healthz|/readyz"}[5m])
            )
          )
          > 0.5
          and
          sum by (job, route) (
            rate(http_request_duration_seconds_bucket{job="go-agents",route!~"/healthz|/readyz",le="+Inf"}[5m])
          )
          > 0.2
        # Warning, not critical, so it is allowed to be slow and certain. Ten
        # minutes on top of the 5m rate window means a p99 excursion has to
        # survive a garbage collection pause, a node hiccup and a scrape gap
        # before anyone is told.
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'go-agents p99 latency on {{ $labels.route }} is above 500ms'
          description: 'p99 latency for route {{ $labels.route }} (job {{ $labels.job }}) is {{ $value | printf "%.2f" }}s over the last 5m, against a threshold of 0.50s.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/on-call-triage.md'

      # ---------------------------------------------------------------------
      # Saturation
      # ---------------------------------------------------------------------

      # avg_over_time rather than a bare gauge with a long `for`: `for` demands
      # the condition hold at every single evaluation, so one sample dipping
      # under the threshold resets the timer and a genuinely saturated service
      # never pages. Averaging asks the question that was actually meant, which
      # is whether concurrency was high across the window rather than at every
      # instant in it.
      #
      # 20 is anchored to the pod, not to Go: the container requests 50m CPU,
      # a twentieth of a core. Twenty requests resident on that budget means
      # they are queueing behind each other, not being served in parallel.
      - alert: GoAgentsSaturation
        expr: avg_over_time(http_requests_in_flight{job="go-agents"}[5m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'go-agents instance {{ $labels.instance }} is saturated'
          description: '{{ $labels.instance }} (job {{ $labels.job }}) averaged {{ $value | printf "%.1f" }} concurrent in-flight requests over the last 5m, against a threshold of 20. Requests are queueing rather than being served.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/on-call-triage.md'

      # ---------------------------------------------------------------------
      # Dependency health
      # ---------------------------------------------------------------------

      # This is the rule that separates "the store is broken" from "traffic is
      # erroring". /readyz returns 503 when the note store is unavailable, and
      # the readinessProbe pulls the pod out of the Service on the second
      # consecutive failure, so those 503s never reach a user and never appear
      # in GoAgentsHighErrorRate. Without this rule the symptom is capacity
      # quietly halving with no alert attached.
      #
      # Expressed as a ratio, not a rate, on purpose: a rate threshold would
      # hard-code the kubelet's 5s probe period, and would silently stop
      # working the day periodSeconds changes in deployment.yaml. A ratio also
      # refuses to fire on a single blip, which a `rate(...) > 0` would not: a
      # lone 503 keeps that rate above zero for the whole 5m lookback and would
      # page every time.
      - alert: GoAgentsReadinessFailing
        expr: |
          sum by (job, instance) (
            rate(http_requests_total{job="go-agents",route="/readyz",status="503"}[5m])
          )
          /
          sum by (job, instance) (
            rate(http_requests_total{job="go-agents",route="/readyz"}[5m])
          )
          > 0.5
        # More than half of five minutes of probes have failed and stayed
        # failed for five more. The pod has been out of the Service for the
        # whole of that and is not recovering on its own.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'go-agents readiness is failing on {{ $labels.instance }}'
          description: 'The 503 ratio on /readyz from {{ $labels.instance }} (job {{ $labels.job }}) is {{ $value | printf "%.2f" }} over the last 5m, against a threshold of 0.50. The pod is out of the Service because a dependency is unavailable, not because traffic is erroring.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/health-check-failure.md'

      # ---------------------------------------------------------------------
      # Rollout
      # ---------------------------------------------------------------------

      # build_info is always 1, so it carries no signal in its value; the
      # signal is the cardinality of its version label. Counting distinct
      # versions is what makes a stuck rollout visible at all. With
      # maxUnavailable 0 a bad image never becomes unhealthy, it simply never
      # becomes Ready, so nothing else in this file notices: error rate,
      # latency and readiness all stay clean while the old ReplicaSet keeps
      # serving. The only evidence is that two versions are still up.
      - alert: GoAgentsVersionSkew
        expr: count by (job) (count by (job, version) (build_info{job="go-agents"})) > 1
        # deployment.yaml sets progressDeadlineSeconds: 120, so a healthy
        # rollout of two replicas converges in about two minutes. Ten is five
        # times the budget: past that it is stuck, not in progress.
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'go-agents is running more than one version'
          description: '{{ $value | printf "%.0f" }} distinct build_info versions are serving job {{ $labels.job }} and have been for 10 minutes, well past the 120s progressDeadlineSeconds. The rollout is stuck: finish it or roll it back.'
          runbook_url: 'https://github.com/nerds-run/go-agents/blob/main/docs/runbooks/rollback.md'
