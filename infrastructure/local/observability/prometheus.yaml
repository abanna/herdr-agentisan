apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
rules:
  # `list` and `watch`, and deliberately not `get`. The kubernetes_sd_config
  # discovers pods through a client-go informer, which Lists once and then
  # Watches; it never fetches a pod by name. Granting `get` as well would be
  # copied from the usual example manifests and would widen the role for a call
  # that is never made.
  #
  # Only pods. role: pod is the only discovery this config uses, so nodes,
  # services, endpoints and the /metrics nonResourceURL that the upstream
  # example grants would all be permissions with no caller.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
# Cluster-scoped because pod discovery is: Prometheus scrapes the go-agents
# namespace as well as its own. Scoping this to a Role in `observability` would
# make the app's metrics invisible, which is the entire point of the stack.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: kind-go-agents

    # The rules arrive from a different file, owned by a different change:
    # kustomize generates the prometheus-alert-rules ConfigMap from
    # alerts/rules.yaml. The glob rather than a filename means adding a second
    # rules file needs no edit here.
    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # Self-scrape by loopback, not through the Service and not through the
      # pod-annotation job below. A server that cannot scrape itself is a
      # server whose own `up`, rule evaluation and TSDB metrics are missing
      # exactly when you need them, and loopback keeps that independent of DNS,
      # of kube-proxy and of the RBAC above.
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      # Everything else is discovered. Nothing in this file names the app: a
      # pod opts in by carrying prometheus.io/scrape, which is why deploying a
      # second service needs no change to Prometheus.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Opt-in, not opt-out. Without this keep, discovery would try to
          # scrape :80 on every pod in the cluster, including kube-system.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Terminal and unscheduled pods have no reachable endpoint. Left in,
          # they produce up == 0 targets that look identical to a real outage.
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Succeeded|Failed|Pending)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Discovery reports the pod IP with the FIRST declared container
          # port. The app declares 8080 before 9090, so without this rewrite
          # Prometheus would scrape the public API port and get a 404 on
          # /metrics. The regex strips whatever port discovery chose and
          # substitutes the annotated one.
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          # `job` comes from the workload, not from this file's job_name, so a
          # query says job="go-agents" rather than job="kubernetes-pods".
          # The regex guard matters: a pod without the label keeps the
          # job_name default instead of getting an empty job label, which
          # would silently merge unrelated series.
          - source_labels:
              [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: job
            regex: (.+)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  # Recreate: the TSDB is an emptyDir owned by one process. Two replicas during
  # a rollout would both scrape every target and neither would hold the whole
  # history, and Prometheus takes a file lock on its data directory anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: metrics
      # No prometheus.io/scrape annotation on purpose: the loopback job above
      # already covers this pod, and annotating it would produce a second,
      # differently-labelled copy of every series about the server itself.
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Verified against the image: USER is `nobody`, which is 65534 there.
        # Spelled numerically because the kubelet cannot resolve a name from an
        # image it has not started yet.
        runAsUser: 65534
        runAsGroup: 65534
        # The TSDB emptyDir is created root-owned; fsGroup hands it to the
        # running process. Without it, --storage.tsdb.path is unwritable and
        # the server exits during startup.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          # v3.6.0 exactly, matching the promtool that checks the rules in CI.
          # A rules file promtool accepts but the server rejects is the failure
          # this pin removes: it turns a green gate followed by a CrashLoop
          # into a single verdict from a single binary version.
          image: prom/prometheus:v3.6.0
          imagePullPolicy: IfNotPresent
          args:
            # config/ and rules/ are SIBLING mounts, not one nested inside the
            # other. A volume mounted inside a ConfigMap volume is fragile: the
            # kubelet's atomic writer rewrites that directory on every update
            # and prunes entries it does not own, so the inner mountpoint is a
            # path it will eventually try to remove. Two mounts into the
            # image's own /etc/prometheus avoid the question entirely.
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Six hours. The volume is an emptyDir that dies with the pod, so a
            # longer retention would only promise more data than the storage
            # can outlive while consuming more of the node's disk.
            - --storage.tsdb.retention.time=6h
            # Enables POST /-/reload. Alert rules are the file most likely to
            # change while the stack is up, and a restart to pick them up would
            # discard the entire in-memory-plus-emptyDir history — including
            # the incident being investigated.
            #
            # The endpoint is unauthenticated. What bounds that is that there
            # is no Ingress and no NodePort, so nothing OUTSIDE the cluster
            # reaches it. Inside the cluster it is open to any pod: there is no
            # NetworkPolicy here, and it would be wrong to claim port-forward
            # is the access control — port-forward is how a HUMAN gets in, not
            # what keeps anything else out. Reloading rules is not destructive;
            # this would need real authentication before the flag belonged in a
            # cluster with untrusted workloads.
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # /-/ready, not /-/healthy: during WAL replay the server is alive
            # but answers queries with 503, and readiness is the probe that is
            # allowed to say so.
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            # Generated by kustomize from alerts/rules.yaml. The generator runs
            # with disableNameSuffixHash so this name is stable enough to write
            # down; the trade is that a rules edit does not roll the pod, which
            # is what --web.enable-lifecycle above is for.
            name: prometheus-alert-rules
        - name: data
          # readOnlyRootFilesystem means the TSDB needs somewhere real to live.
          # emptyDir, not a PVC: see tempo.yaml — this cluster is disposable
          # and pretending otherwise would be the lie.
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
