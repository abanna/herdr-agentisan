apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs-backend
data:
  # Mounted at a path chosen here rather than over the image's own
  # /etc/loki/local-config.yaml, so `docker run grafana/loki:3.5.7` still
  # demonstrates the vendor default and this file is visibly ours. -config.file
  # below is therefore mandatory: the image's CMD points at the default and is
  # replaced wholesale by args.
  config.yaml: |
    # Single-tenant. There is no multi-tenancy to authenticate BETWEEN, so
    # auth_enabled: false does not disable a protection — it selects the
    # single-tenant mode, in which Loki serves everything as tenant "fake" and
    # does not require an X-Scope-OrgID header. Turning it on would mean every
    # pusher and Grafana had to agree on a tenant id, protecting nothing: what
    # actually bounds access is that there is no Ingress and no NodePort, so
    # nothing outside the cluster can reach 3100 at all. This is why there is
    # no credential in this file to leak — there is no credential.
    auth_enabled: false

    server:
      # Spelled out for the same reason as Tempo's: a bind host that is written
      # down cannot regress to a localhost default that accepts nothing from
      # another pod.
      http_listen_address: 0.0.0.0
      http_listen_port: 3100
      # 9096, not the 9095 in Loki's own examples, purely so the ports across
      # this namespace stay distinguishable in a `ss -ltnp` — nothing in the
      # cluster dials it.
      grpc_listen_address: 0.0.0.0
      grpc_listen_port: 9096

    common:
      # 127.0.0.1 because the ring below is in-memory and has exactly one
      # member: this process advertising itself to itself. Advertising the pod
      # IP would be pointless indirection through the pod's own netns.
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        # Filesystem, on an emptyDir, for the reason spelled out in
        # tempo.yaml: this cluster is disposable, so a PVC would promise a
        # durability the cluster itself does not have.
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        # TSDB + schema v13. Not a default worth drifting from: v13 is what
        # makes structured metadata (and therefore the native OTLP endpoint)
        # legal, and older schemas silently reject it. The `from` date is in
        # the past because a schema period may not start in the future — Loki
        # refuses to start otherwise.
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # Required by the OTLP endpoint: OTLP log attributes that are not mapped
      # to a stream label are stored as structured metadata, and with this off
      # /otlp/v1/logs rejects the push.
      allow_structured_metadata: true
      # Six hours, matching Prometheus's TSDB retention and Tempo's block
      # retention. Deliberately short, and short for a storage reason rather
      # than a policy one: the chunks live on an emptyDir inside a 512Mi pod
      # on a laptop, so the real question is not "how long may we keep logs"
      # but "how much of the node's disk may an idle background stack eat".
      # Six hours of a two-replica local service is a few megabytes; a day of
      # a load test is not. Nothing here is a system of record.
      retention_period: 6h
      # Enables /loki/api/v1/index/volume, which is what Grafana's log-volume
      # histogram above the Explore results queries. Without it that panel is
      # permanently empty and looks like missing data rather than a missing
      # feature.
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
      # retention_enabled is what actually makes retention_period delete
      # anything: without it the limit is recorded and never enforced, and the
      # emptyDir grows until the pod is evicted. delete_request_store is not
      # optional once retention is on — Loki refuses to start without it.
      retention_enabled: true
      delete_request_store: filesystem

    # Off for the same reason as Tempo's usage_report: a laptop cluster is not
    # a fleet worth reporting on, and an unrequested outbound call is a
    # surprise.
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs-backend
spec:
  replicas: 1
  # Recreate: the chunk store and the TSDB index are an emptyDir owned by one
  # process, and replication_factor is 1. A second replica would answer from a
  # different half of the logs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: logs-backend
      annotations:
        # loki_distributor_lines_received_total on this port answers "did
        # Alloy's push land?" without opening Grafana — the same reason the
        # tracing backend is scraped. Queries as job="loki".
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Verified against the image: Config.User is 10001.
        runAsUser: 10001
        runAsGroup: 10001
        # /loki is an emptyDir created root-owned; without fsGroup the
        # chunks and WAL directories are unwritable and Loki exits at startup.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          # 3.5.7, verified with `docker manifest inspect`. 3.x specifically:
          # the native OTLP ingestion endpoint and structured metadata that
          # this config depends on do not exist in 2.x. The config above was
          # booted against this exact tag and a line was pushed and read back
          # before it was committed — Loki rejects unknown config keys, so an
          # invented one is a CrashLoop, not a warning.
          image: grafana/loki:3.5.7
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/config.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            # Measured: /ready answers 17s after start, behind ring join and
            # index bootstrap. startupProbe rather than initialDelaySeconds for
            # the reason in infrastructure/local/k8s/deployment.yaml — a fixed
            # delay is paid on every rollout and is wrong in both directions.
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            # Same endpoint as readiness because it is the only one Loki has,
            # at a much looser threshold: a compaction that makes Loki slow
            # enough to fail readiness must not also restart it and lose the
            # unflushed WAL.
            httpGet:
              path: /ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-config
        # readOnlyRootFilesystem holds because every path Loki writes is under
        # this one mount: path_prefix, both storage directories and the
        # compactor's working_directory are all configured under /loki above,
        # deliberately, so that one emptyDir is provably enough.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    # One port does three jobs on Loki 3: Alloy pushes to
    # /loki/api/v1/push, Grafana queries /loki/api/v1/query_range, and
    # /otlp/v1/logs accepts OTLP natively.
    #
    # That third one is available and currently UNUSED, on purpose. Nothing in
    # this cluster emits OTLP logs — internal/telemetry wires otlptracehttp
    # only — so logs reach Loki from Alloy, which reads them from the
    # Kubernetes API where the container's stdout already is. Having the
    # endpoint means adding an OTLP log exporter to the service later needs no
    # Loki-specific exporter in the collector and no change to this file.
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
  # 9096 is not published: in single-binary mode the internal gRPC port is how
  # Loki's own modules reach each other, and nothing else should dial it.
