# herdr-agentisan.toml: an example of the plugin's configuration (ADR-001 D9).
#
# Copy it to $HERDR_PLUGIN_CONFIG_DIR/herdr-agentisan.toml, then check what it
# resolves to and where each value came from:
#
#   herdr-agentisan config resolve                    # shared values, project list
#   herdr-agentisan config resolve --project assay    # one project's profile
#   herdr-agentisan config resolve --project assay --check-secrets
#
# Layers, lowest to highest precedence:
#
#   1. built-in defaults: agent.command = ["claude"],
#      rotation.thresholds = [55, 65, 75]
#   2. the shared tables below: every top-level table except [projects]
#   3. [projects.<name>], the only place short and layout can be set
#   4. <repo>/.herdr-agentisan.toml: a profile body with its own
#      schema_version = 1. It is committed, so it sets only color,
#      github, a group's workers and slots, models and
#      rotation.thresholds (ADR-001 A46). Everything else, what runs or
#      is typed in your terminals, where a secret goes, a group's
#      description and any key added later, comes only from this file
#      and --set.
#   5. --set key.path=value on the command line, e.g.
#      --set groups.coder.workers=4  --set 'rotation.thresholds=[50,60,70]'
#
# Tables deep-merge, key by key. Strings, numbers and lists (including
# verify and agent.command) replace whole. So do secret references.
#
# Secrets are never written here. A secret field (integrations.<name>.token)
# holds a reference, and nothing else:
#
#   { env = "NAME" }                   read from the environment
#   { op = "op://Vault/Item/field" }   read with `op read` (1Password CLI)
#
# A plain string there fails with "secret is not a reference".

schema_version = 1

# ---------------------------------------------------------------------------
# Shared tables: every project inherits these.
# ---------------------------------------------------------------------------

# D12: the agent must be claude or codex (by base name), without --bare, and
# any --setting-sources must include project, so the repo's Agentisan
# bundle (.claude/version.txt) is loaded.
# A model, here or in any layer, is a letter or digit, then letters,
# digits and . _ - : / @ [ ], at most 128 bytes, such as opus[1m]: the
# workforce passes it to the agent, so nothing a shell would read (A46).
[agent]
command = ["claude"]
model = "opus"

# The context percentages at which the daemon tells a team's boss a pane is
# due to rotate (ADR-001 D7, A33): soft, hard and the ceiling, which also
# alerts you with a toast. Three whole numbers from 1 to 100, ascending, each
# crossed at its percentage or above. These are the project's, and the
# boss's; a group can set its own (see librarian below). Read once when the
# daemon starts, from this file, the project's table and the repo file.
[rotation]
thresholds = [55, 65, 75]

# What the daemon tells each team's boss from its team poll (ADR-001 A44): a
# worker's turn ended, it turned blocked or unknown, it left the team, and,
# once, that the daemon started. skip names the kinds not told: turn_ended,
# blocked, unknown, gone, started, and the context levels ctx_soft and
# ctx_hard; ctx_ceiling always goes. A boss gets at most one message every
# gap seconds (0 to 3600) and the same worker and kind again within repeat
# seconds (0 to 86400) is dropped. Read once when the daemon starts, from
# this file only, never a repo file.
[notices]
skip = []
gap = 30
repeat = 300

# Each group is a worker type: coder, precheck, qa, review (Codex), research,
# librarian or debugger. workers is how many `team up` starts, slots is the
# cap the boss can scale to (64 >= slots >= workers >= 0). boss is not a
# type: the boss has its own tab.
#
# description is the group's one-line purpose, drawn under its title on the
# dashboard (ADR-001 A36): at most 80 printable characters. It goes with the
# group's name as the dashboard shows it, a tabs team's worker type or a ◆
# space's name, and a group table may set it alone (see agentisan's coders
# below). The daemon reads descriptions again whenever this file changes, so
# an edit needs no restart; a repo's .herdr-agentisan.toml cannot set one.
#
# A group's own agent (ADR-001 A23), which `worker spawn` launches (it lands
# in a later part of NERD-5254; the key resolves now): with a command of its
# own, a type runs that command and that model only, never the [agent] model
# above. Without one, review runs codex --no-daemon (A22), and every other
# type [agent]'s command, with the group's model or [agent]'s. The command
# runs claude or codex (D12) and carries no --model, -m, --name or -n: the
# workforce sets them.
[groups.precheck]
workers = 1
slots = 1
description = "a pre-Codex adversarial pass on finalized heads"
agent = { model = "sonnet" }

[groups.librarian]
workers = 1
slots = 1
# A librarian reads a lot, so it is rotated sooner.
rotation = { thresholds = [45, 55, 65] }

[groups.debugger]
workers = 0
slots = 1

[integrations.github]
token = { env = "GITHUB_TOKEN" }

# How `worker spawn` waits for a new tab's shell before it starts the agent
# there (ADR-001 A23; spawn lands in a later part of NERD-5254, the keys
# resolve now). herdr only checks that the shell has the terminal, so a shell
# asking a question at startup (oh-my-zsh's update prompt, say) would get the
# agent's command line typed into it.
#
#   shell_prompt         a regular expression one line of your prompt
#                        matches; spawn waits for it. Unset, spawn does not.
#                        herdr matches it with Rust's regex syntax; resolve
#                        compiles it with Go's, a first check only, so a
#                        construct Rust lacks (a literal {, \Q…\E, a nested
#                        [) passes here and fails the spawn.
#   shell_ready_keys     keys sent once when the shell is still not ready
#                        after shell_ready_after_s and a program (a password
#                        prompt, say) has the terminal. Default none.
#                        WARNING: a key is typed into whatever prompt is up:
#                        "enter" answers Y to a [Y/n] question. Leave it
#                        empty unless you know which prompt it will answer.
#   shell_ready_after_s  default 3, at most 60.
#
# Once spawn lands, a worker's shell will have HERDR_AGENTISAN_WORKER set to
# its logical id, so your shell profile can skip its questions there instead.
[spawn]
shell_prompt = '❯\s*$'

# The project today's ◆ group spaces belong to (ADR-001 A17): the daemon
# pushes $team to each "◆ <group>" workspace and files its panes under this
# project. It must name a project below. Only this file and --set may set
# it. Left out, the one project configured is used, unless it sets
# layout = "tabs"; with none or several, the spaces belong to one unnamed
# project. The daemon reads it when it starts: run the daemon-restart action
# after changing it.
[spaces]
project = "agentisan"

# Where the daemon sends its workflow events (docs/telemetry.md): an OTLP/HTTP
# collector as host:port, plaintext, on localhost. Shared file and --set
# only; HERDR_AGENTISAN_OTLP_ENDPOINT overrides it. Leave it out, or set "",
# and nothing is exported. 127.0.0.1:4328 is the collector `task otelcol:up`
# runs (docs/config/otelcol-agentisan.yaml).
[telemetry]
endpoint = "127.0.0.1:4328"

# The debugger's env file (docs/debugger.md, ADR-001 item 12). Its `events`
# commands read ELASTIC_URL and ELASTIC_API_KEY, a read-only key, from this
# file each time they query, and take nothing else from it: the key never
# enters the agent's environment. An absolute path or one under ~/, on this
# machine, never in a repo; a file 1Password mounts works. Shared file and
# --set only.
[debugger]
env_file = "~/.config/herdr-agentisan/elastic.env"

# The test slots the dashboard header shows as "slots used/total" (ADR-001
# A31): one lock file per slot, as absolute paths; ~ is not expanded. A slot
# is in use while some process holds a lock on its file, and held, not used,
# while a `flock <lock> sleep …` holds it (A40). Shared file, a project's own
# table and --set only; a repo file may not set them. agentisan's gate keeps
# one per AGENTISAN_GATE_CONCURRENCY slot in $XDG_RUNTIME_DIR/agentisan; keep
# them on tmpfs or ext4.
[tests]
locks = ["/run/user/1000/agentisan/gate.0.lock"]

# Model routing (ADR-001 A50): the built-in routing rules
# (internal/routing/rules/jev-routing-v1.json) choose each worker's model and
# effort by its type's role; this table holds what they leave to you. Shared
# file and --set only. `worker spawn` asks routing from NERD-5289 part 1b on.
#   enabled  false (the default) launches as configured above; true lets
#            routing decide, and then no agent.model key may be set.
#   [routing.bindings.<binding>]  model_id ("" is unresolved), efforts and
#            enabled, e.g. [routing.bindings.claude_mid] model_id = "…".
#   [routing.overrides]  <role> = "<binding>": your standing choice, and the
#            only way to a premium binding (Fable, Astra). This file only.
[routing]
enabled = false

# ---------------------------------------------------------------------------
# Projects. The key is the project's name: lower case, digits and dashes.
#
# Every project but the [spaces] project is a tabs team (ADR-001 A19): one
# herdr workspace labelled with the project's name, holding the boss's tab,
# <short>-boss, and one full-size tab per worker, <short>-<type>-<n>, which
# is also the worker's herdr agent name. short is required there: a
# lower-case letter, then up to 7 more lower-case letters or digits, unique
# across projects.
# layout is "tabs" by default, and "spaces" only for the [spaces] project.
# The daemon reads the teams when it starts: after adding a team, run the
# daemon-restart action.
# ---------------------------------------------------------------------------

[projects.agentisan]
repo = "~/Development/nerdsrun/agentisan-skills"
color = "#7c3aed"
# The repo as owner/name. The daemon shows its open PRs and open-issue count
# in the dashboard header, through gh's own login (ADR-001 A29); it reads
# this when it starts.
github = "nerds-run/agentisan-skills"
verify = [["task", "check"]]

# The project's own test slots replace the shared [tests] locks for its team
# (A40); locks = [] shows none.
[projects.agentisan.tests]
locks = ["/tmp/agentisan-suite-1000.lock", "/tmp/agentisan-suite-1000.slot2.lock", "/tmp/agentisan-suite-1000.slot3.lock"]

[projects.agentisan.groups.coder]
workers = 3
slots = 5

[projects.agentisan.groups.qa]
workers = 1
slots = 2
description = "runs the pre-PR test gates and owns the test-slot queue"

# agentisan's team is the ◆ spaces, so its groups are the spaces' names: this
# describes ◆ coders and starts no worker (the workers are the coder type's).
[projects.agentisan.groups.coders]
description = "write fixes + new code · run their own review loop"

[projects.agentisan.groups.review]
workers = 1
slots = 1

[projects.agentisan.groups.research]
workers = 0
slots = 1

# Overrides one key of the shared group; its slots still come from above.
[projects.agentisan.groups.librarian]
workers = 0

[projects.agentisan.integrations.linear]
url = "https://linear.app/nerds-run"
token = { op = "op://Engineering/Linear API/credential" }

[projects.assay]
short = "as"
layout = "tabs"
repo = "~/Development/nerdsrun/assay"
color = "#0ea5e9"
github = "nerds-run/assay"
verify = [["task", "check"], ["task", "test:unit"]]

[projects.assay.agent]
model = "sonnet"

[projects.assay.groups.coder]
workers = 2
slots = 4

[projects.assay.groups.qa]
workers = 1
slots = 2

[projects.assay.groups.review]
workers = 1
slots = 2

[projects.assay.groups.research]
workers = 1
slots = 2

[projects.assay.groups.debugger]
workers = 1
slots = 2

[projects.assay.integrations.linear]
url = "https://linear.app/nerds-run"
token = { op = "op://Engineering/Linear API/section/credential" }
